 <!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-W9695JZYKH"></script>

function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());

<title>SR CRESCO KNOWLEDGE AI</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
height:100%;
font-family:Arial,Helvetica,sans-serif;
background:#ffffff;
color:#1f2937;
}

body{
display:flex;
overflow:hidden;
}

/* ================= SIDEBAR ================= */

.sidebar{
width:270px;
height:100vh;
background:#123d25;
color:white;
display:flex;
flex-direction:column;
padding:14px;
flex-shrink:0;
}

.brand{
display:flex;
align-items:center;
gap:10px;
padding:8px 5px 18px;
}

.brand img{
width:42px;
height:42px;
object-fit:contain;
}

.brand-text{
font-size:15px;
font-weight:bold;
line-height:1.25;
}

.new-chat{
width:100%;
border:1px solid rgba(255,255,255,.25);
background:rgba(255,255,255,.08);
color:white;
padding:12px 14px;
border-radius:10px;
cursor:pointer;
font-size:14px;
text-align:left;
}

.new-chat:hover{
background:rgba(255,255,255,.15);
}

.history-title{
font-size:12px;
opacity:.65;
margin:22px 8px 8px;
}

.history{
flex:1;
overflow-y:auto;
}

.history-item{
padding:10px 11px;
border-radius:8px;
font-size:13px;
cursor:pointer;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-bottom:3px;
}

.history-item:hover{
background:rgba(255,255,255,.10);
}

.sidebar-bottom{
border-top:1px solid rgba(255,255,255,.15);
padding-top:12px;
}

.clear-all{
width:100%;
border:0;
background:transparent;
color:white;
opacity:.8;
padding:10px;
cursor:pointer;
text-align:left;
border-radius:8px;
}

.clear-all:hover{
background:rgba(255,255,255,.08);
opacity:1;
}

/* ================= MAIN ================= */

.main{
height:100vh;
flex:1;
display:flex;
flex-direction:column;
min-width:0;
}

/* ================= TOP BAR ================= */

.topbar{
height:64px;
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
padding:0 18px;
gap:14px;
background:#fff;
}

.menu-btn{
display:none;
border:0;
background:transparent;
font-size:24px;
cursor:pointer;
}

.top-title{
font-size:17px;
font-weight:bold;
color:#18351f;
}

.status{
font-size:11px;
color:#176b35;
background:#edf7ef;
padding:5px 9px;
border-radius:20px;
}

/* ================= CHAT ================= */

.chat-container{
flex:1;
overflow-y:auto;
padding:30px 15px 150px;
}

.chat-inner{
max-width:820px;
margin:auto;
}

.welcome{
text-align:center;
padding:70px 15px 30px;
}

.welcome-logo{
width:70px;
height:70px;
object-fit:contain;
margin-bottom:15px;
}

.welcome h1{
font-size:27px;
margin:5px 0 10px;
color:#18351f;
}

.welcome p{
color:#6b7280;
margin:0;
font-size:14px;
line-height:1.6;
}

.message{
display:flex;
gap:12px;
margin:25px 0;
}

.message.user{
justify-content:flex-end;
}

.avatar{
width:32px;
height:32px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;
font-size:15px;
}

.ai-avatar{
background:#e8f2ea;
}

.user-avatar{
background:#176b35;
color:white;
}

.message-content{
max-width:78%;
font-size:15px;
line-height:1.7;
word-wrap:break-word;
}

.message.user .message-content{
background:#176b35;
color:white;
padding:11px 15px;
border-radius:17px;
border-bottom-right-radius:5px;
}

.message.ai .message-content{
color:#1f2937;
padding-top:2px;
}

/* ================= ACTIONS ================= */

.message-actions{
display:flex;
gap:5px;
margin-top:7px;
}

.action-btn{
border:0;
background:transparent;
color:#6b7280;
cursor:pointer;
font-size:12px;
padding:5px 7px;
border-radius:6px;
}

.action-btn:hover{
background:#f1f3f1;
color:#176b35;
}

/* ================= TYPING ================= */

.typing{
display:flex;
gap:5px;
align-items:center;
padding:8px 0;
}

.dot{
width:7px;
height:7px;
background:#176b35;
border-radius:50%;
animation:blink 1.2s infinite;
}

.dot:nth-child(2){
animation-delay:.2s;
}

.dot:nth-child(3){
animation-delay:.4s;
}

@keyframes blink{

0%,80%,100%{
opacity:.25;
}

40%{
opacity:1;
}

}

/* ================= INPUT ================= */

.input-area{
position:fixed;
bottom:0;
left:270px;
right:0;
background:linear-gradient(
to top,
#ffffff 75%,
rgba(255,255,255,0)
);
padding:20px 15px 18px;
}

.input-inner{
max-width:820px;
margin:auto;
}

.input-box{
display:flex;
align-items:flex-end;
gap:8px;
border:1px solid #cfd5cf;
border-radius:17px;
padding:8px 9px 8px 15px;
background:white;
box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.input-box:focus-within{
border-color:#176b35;
box-shadow:0 2px 15px rgba(23,107,53,.12);
}

#userMessage{
flex:1;
border:0;
outline:0;
resize:none;
font-family:Arial,Helvetica,sans-serif;
font-size:15px;
line-height:1.5;
max-height:150px;
min-height:26px;
background:transparent;
color:#1f2937;
}

#userMessage::placeholder{
color:#8a918b;
}

.send-btn{
width:40px;
height:40px;
border:0;
border-radius:11px;
background:#176b35;
color:white;
cursor:pointer;
font-size:18px;
flex-shrink:0;
}

.send-btn:hover{
background:#12552a;
}

.send-btn:disabled{
opacity:.5;
cursor:not-allowed;
}

.input-note{
text-align:center;
font-size:10px;
color:#8a918b;
margin-top:7px;
}

/* ================= MOBILE ================= */

.overlay{
display:none;
}

@media(max-width:750px){

.sidebar{
position:fixed;
left:-280px;
top:0;
z-index:100;
transition:left .25s ease;
box-shadow:5px 0 20px rgba(0,0,0,.15);
}

.sidebar.open{
left:0;
}

.overlay.show{
display:block;
position:fixed;
inset:0;
background:rgba(0,0,0,.35);
z-index:90;
}

.menu-btn{
display:block;
}

.input-area{
left:0;
}

.topbar{
height:58px;
padding:0 12px;
}

.top-title{
font-size:15px;
}

.status{
display:none;
}

.chat-container{
padding:20px 10px 140px;
}

.welcome{
padding:55px 10px 25px;
}

.welcome h1{
font-size:22px;
}

.message-content{
max-width:88%;
font-size:14px;
}

.avatar{
width:29px;
height:29px;
font-size:13px;
}

.input-area{
padding:14px 10px 13px;
}

}

/* ================= SCROLLBAR ================= */

::-webkit-scrollbar{
width:7px;
}

::-webkit-scrollbar-thumb{
background:#cfd5cf;
border-radius:10px;
}

</style>

</head>

<body>

<!-- MOBILE OVERLAY -->

<div class="overlay" id="overlay"></div>


<!-- ================= SIDEBAR ================= -->

<aside class="sidebar" id="sidebar">

<div class="brand">

<a href="index.html">
<img src="logo.png" alt="SR CRESCO Logo">
</a>

<div class="brand-text">
SR CRESCO<br>
KNOWLEDGE AI
</div>

</div>


<button class="new-chat" id="newChat">
＋ New chat
</button>


<div class="history-title">
CHAT HISTORY
</div>


<div class="history" id="history"></div>


<div class="sidebar-bottom">

<button class="clear-all" id="clearAll">
🗑 Clear all chats
</button>

</div>

</aside>


<!-- ================= MAIN ================= -->

<section class="main">


<header class="topbar">

<button class="menu-btn" id="menuBtn">
☰
</button>

<div class="top-title">
SR CRESCO KNOWLEDGE AI
</div>

<div class="status">
● AI Online
</div>

</header>


<!-- ================= CHAT ================= -->

<div class="chat-container" id="chatContainer">

<div class="chat-inner" id="chatMessages">

<div class="welcome" id="welcome">

<img
src="logo.png"
class="welcome-logo"
alt="SR CRESCO"
>

<h1>
How can I help you?
</h1>

<p>
I'm <b>SR CRESCO KNOWLEDGE AI</b>.<br>
Ask questions, learn, create, research or get help with agriculture and technology.
</p>

</div>

</div>

</div>


<!-- ================= INPUT ================= -->

<div class="input-area">

<div class="input-inner">

<div class="input-box">

<textarea
id="userMessage"
rows="1"
placeholder="Message SR CRESCO KNOWLEDGE AI..."
autocomplete="off"
></textarea>


<button
class="send-btn"
id="sendBtn"
title="Send"
>
➤
</button>

</div>


<div class="input-note">
SR CRESCO KNOWLEDGE AI can make mistakes. Check important information.
</div>

</div>

</div>

</section>


<script>

/* ================= ELEMENTS ================= */

const input = document.getElementById("userMessage");

const sendBtn = document.getElementById("sendBtn");

const chatMessages = document.getElementById("chatMessages");

const chatContainer = document.getElementById("chatContainer");

const sidebar = document.getElementById("sidebar");

const menuBtn = document.getElementById("menuBtn");

const overlay = document.getElementById("overlay");

const newChatBtn = document.getElementById("newChat");

const clearAllBtn = document.getElementById("clearAll");

const historyDiv = document.getElementById("history");


/* ================= STATE ================= */

let conversation = [];

let chats = JSON.parse(
localStorage.getItem("srcresco_chats") || "[]"
);

let currentChatId = null;


/* ================= SEND BUTTON ================= */

/* THIS WAS MISSING */

sendBtn.addEventListener("click", function(){

sendMessage();

});


/* ================= MOBILE SIDEBAR ================= */

menuBtn.addEventListener("click",function(){

sidebar.classList.add("open");

overlay.classList.add("show");

});


overlay.addEventListener("click",function(){

sidebar.classList.remove("open");

overlay.classList.remove("show");

});


/* ================= NEW CHAT ================= */

newChatBtn.addEventListener("click",function(){

startNewChat();

sidebar.classList.remove("open");

overlay.classList.remove("show");

});


function startNewChat(){

conversation = [];

currentChatId = Date.now();

chatMessages.innerHTML = `

<div class="welcome" id="welcome">

<img
src="logo.png"
class="welcome-logo"
alt="SR CRESCO"
>

<h1>
How can I help you?
</h1>

<p>
I'm <b>SR CRESCO KNOWLEDGE AI</b>.<br>
Ask questions, learn, create, research or get help with agriculture and technology.
</p>

</div>

`;

input.value = "";

autoResize();

input.focus();

}


/* ================= SEND MESSAGE ================= */

async function sendMessage(){

const message = input.value.trim();

if(!message || sendBtn.disabled){

return;

}


/* Remove welcome */

const welcome =
document.getElementById("welcome");

if(welcome){

welcome.remove();

}


/* Add user message */

addMessage(
"user",
message
);


conversation.push({

role:"user",

content:message

});


input.value = "";

autoResize();

sendBtn.disabled = true;


/* ================= TYPING ================= */

const typing =
document.createElement("div");

typing.className =
"message ai";

typing.id =
"typing";

typing.innerHTML = `

<div class="avatar ai-avatar">
🌱
</div>

<div class="message-content">

<div class="typing">

<span class="dot"></span>

<span class="dot"></span>

<span class="dot"></span>

</div>

</div>

`;

chatMessages.appendChild(typing);

scrollBottom();


/* ================= API ================= */

try{

const response =
await fetch(
"/api/chat",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

messages:conversation

})

}
);


const data =
await response.json();


if(typing){

typing.remove();

}


if(!response.ok){

addMessage(
"ai",
"❌ " +
(data.error ||
"AI request failed.")
);

}else{

const reply =
data.reply ||
"No response received from SR CRESCO KNOWLEDGE AI.";


conversation.push({

role:"assistant",

content:reply

});


addMessage(
"ai",
reply
);


saveCurrentChat();

}

}catch(error){

if(typing){

typing.remove();

}


addMessage(
"ai",
"❌ Unable to connect to SR CRESCO KNOWLEDGE AI. Please try again."
);

}


sendBtn.disabled = false;

input.focus();

scrollBottom();

renderHistory();

}


/* ================= ADD MESSAGE ================= */

function addMessage(type,text){

const messageDiv =
document.createElement("div");

messageDiv.className =
"message " + type;


const avatar =
document.createElement("div");

avatar.className =
"avatar " +
(
type === "ai"
?
"ai-avatar"
:
"user-avatar"
);


avatar.textContent =
type === "ai"
?
"🌱"
:
"U";


const content =
document.createElement("div");

content.className =
"message-content";


content.innerHTML =
escapeHTML(text)
.replace(/\n/g,"<br>");


/* ================= AI ACTIONS ================= */

if(type === "ai"){

const actions =
document.createElement("div");

actions.className =
"message-actions";


actions.innerHTML = `

<button class="action-btn copy-btn">
📋 Copy
</button>

<button class="action-btn regenerate-btn">
↻ Regenerate
</button>

`;


/* COPY */

actions
.querySelector(".copy-btn")
.addEventListener(
"click",
function(){

navigator.clipboard
.writeText(text);

this.textContent =
"✓ Copied";

setTimeout(
()=>{
this.textContent =
"📋 Copy";
},
1500
);

}
);


/* REGENERATE */

actions
.querySelector(".regenerate-btn")
.addEventListener(
"click",
function(){

regenerateLast();

}
);


content.appendChild(actions);

}


/* ================= MESSAGE POSITION ================= */

if(type === "user"){

messageDiv.appendChild(content);

messageDiv.appendChild(avatar);

}else{

messageDiv.appendChild(avatar);

messageDiv.appendChild(content);

}


chatMessages.appendChild(messageDiv);

scrollBottom();

}


/* ================= REGENERATE ================= */

async function regenerateLast(){

if(sendBtn.disabled){

return;

}

if(conversation.length < 2){

return;

}


/* Remove assistant message */

if(
conversation[
conversation.length - 1
].role === "assistant"
){

conversation.pop();

}


/* Remove AI UI */

const messages =
chatMessages.querySelectorAll(
".message.ai"
);


if(messages.length){

messages[
messages.length - 1
].remove();

}


sendBtn.disabled = true;


/* Typing */

const typing =
document.createElement("div");

typing.className =
"message ai";

typing.id =
"typing";

typing.innerHTML = `

<div class="avatar ai-avatar">
🌱
</div>

<div class="message-content">

<div class="typing">

<span class="dot"></span>

<span class="dot"></span>

<span class="dot"></span>

</div>

</div>

`;

chatMessages.appendChild(typing);

scrollBottom();


try{

const response =
await fetch(
"/api/chat",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

messages:conversation

})

}
);


const data =
await response.json();


typing.remove();


if(response.ok){

const reply =
data.reply ||
"No response received.";


conversation.push({

role:"assistant",

content:reply

});


addMessage(
"ai",
reply
);


saveCurrentChat();


}else{

addMessage(
"ai",
"❌ " +
(data.error ||
"Regeneration failed.")
);

}

}catch(error){

typing.remove();

addMessage(
"ai",
"❌ Unable to regenerate response."
);

}


sendBtn.disabled = false;

}


/* ================= SAVE CHAT ================= */

function saveCurrentChat(){

if(!conversation.length){

return;

}


if(!currentChatId){

currentChatId =
Date.now();

}


const firstUser =
conversation.find(
x => x.role === "user"
);


const title =
firstUser
?
firstUser.content.substring(0,35)
:
"New chat";


const existing =
chats.find(
x => x.id === currentChatId
);


if(existing){

existing.messages =
conversation;

existing.title =
title;

}else{

chats.unshift({

id:currentChatId,

title:title,

messages:conversation

});

}


/* Keep last 30 */

chats =
chats.slice(0,30);


localStorage.setItem(
"srcresco_chats",
JSON.stringify(chats)
);

}


/* ================= HISTORY ================= */

function renderHistory(){

historyDiv.innerHTML = "";


chats.forEach(chat => {

const item =
document.createElement("div");


item.className =
"history-item";


item.textContent =
chat.title;


item.title =
chat.title;


item.addEventListener(
"click",
function(){

loadChat(chat.id);

sidebar.classList.remove("open");

overlay.classList.remove("show");

}
);


historyDiv.appendChild(item);

});

}


/* ================= LOAD CHAT ================= */

function loadChat(id){

const chat =
chats.find(
x => x.id === id
);


if(!chat){

return;

}


currentChatId =
chat.id;


conversation =
[...chat.messages];


chatMessages.innerHTML = "";


conversation.forEach(
message => {

addMessage(

message.role === "assistant"
?
"ai"
:
"user",

message.content

);

}
);


scrollBottom();

}


/* ================= CLEAR ALL ================= */

clearAllBtn.addEventListener(
"click",
function(){

if(
!confirm(
"Delete all saved chats?"
)
){

return;

}


chats = [];


localStorage.removeItem(
"srcresco_chats"
);


startNewChat();


renderHistory();

}
);


/* ================= ENTER ================= */

input.addEventListener(
"keydown",
function(event){

if(
event.key === "Enter" &&
!event.shiftKey
){

event.preventDefault();

sendMessage();

}

}
);


/* ================= AUTO RESIZE ================= */

input.addEventListener(
"input",
autoResize
);


function autoResize(){

input.style.height =
"auto";


input.style.height =
Math.min(
input.scrollHeight,
150
) + "px";

}


/* ================= SECURITY ================= */

function escapeHTML(text){

const div =
document.createElement("div");


div.textContent =
text;


return div.innerHTML;

}


/* ================= SCROLL ================= */

function scrollBottom(){

setTimeout(
function(){

chatContainer.scrollTop =
chatContainer.scrollHeight;

},
50
);

}


/* ================= START ================= */

renderHistory();

input.focus();

</script>

</body>
</html>
