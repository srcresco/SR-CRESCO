<title>SR CRESCO KNOWLEDGE AI</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
height:100%;
font-family:Arial,Helvetica,sans-serif;
background:#fff;
color:#1f2937;
}

body{
display:flex;
overflow:hidden;
}

/* ================= SIDEBAR ================= */

.sidebar{
width:270px;
height:100vh;
background:#123d25;
color:#fff;
display:flex;
flex-direction:column;
padding:14px;
flex-shrink:0;
}

.brand{
display:flex;
align-items:center;
gap:10px;
padding:8px 5px 18px;
}

.brand a{
display:flex;
}

.brand img{
width:42px;
height:42px;
object-fit:contain;
}

.brand-text{
font-size:15px;
font-weight:bold;
line-height:1.25;
}

.new-chat{
width:100%;
border:1px solid rgba(255,255,255,.25);
background:rgba(255,255,255,.08);
color:#fff;
padding:12px 14px;
border-radius:10px;
cursor:pointer;
font-size:14px;
text-align:left;
}

.new-chat:hover{
background:rgba(255,255,255,.15);
}

.history-title{
font-size:12px;
opacity:.65;
margin:22px 8px 8px;
}

.history{
flex:1;
overflow-y:auto;
}

.history-item{
padding:10px 11px;
border-radius:8px;
font-size:13px;
cursor:pointer;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-bottom:3px;
}

.history-item:hover{
background:rgba(255,255,255,.10);
}

.sidebar-bottom{
border-top:1px solid rgba(255,255,255,.15);
padding-top:12px;
}

.clear-all{
width:100%;
border:0;
background:transparent;
color:#fff;
opacity:.8;
padding:10px;
cursor:pointer;
text-align:left;
border-radius:8px;
}

.clear-all:hover{
background:rgba(255,255,255,.08);
opacity:1;
}

/* ================= MAIN ================= */

.main{
height:100vh;
flex:1;
display:flex;
flex-direction:column;
min-width:0;
}

/* ================= TOP BAR ================= */

.topbar{
height:64px;
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
padding:0 18px;
gap:14px;
background:#fff;
flex-shrink:0;
}

/* ================= BACK BUTTON ================= */

.back-btn{
border:0;
background:#f1f5f2;
color:#176b35;
padding:8px 12px;
border-radius:9px;
font-size:14px;
font-weight:bold;
cursor:pointer;
white-space:nowrap;
}

.back-btn:hover{
background:#e4eee6;
}

.back-btn:active{
transform:scale(.96);
}

.menu-btn{
display:none;
border:0;
background:transparent;
font-size:24px;
cursor:pointer;
}

.top-title{
font-size:17px;
font-weight:bold;
color:#18351f;
}

.status{
font-size:11px;
color:#176b35;
background:#edf7ef;
padding:5px 9px;
border-radius:20px;
}

/* ================= CHAT ================= */

.chat-container{
flex:1;
overflow-y:auto;
padding:30px 15px 150px;
}

.chat-inner{
max-width:820px;
margin:auto;
}

.welcome{
text-align:center;
padding:70px 15px 30px;
}

.welcome-logo{
width:70px;
height:70px;
object-fit:contain;
margin-bottom:15px;
}

.welcome h1{
font-size:27px;
margin:5px 0 10px;
color:#18351f;
}

.welcome p{
color:#6b7280;
margin:0;
font-size:14px;
line-height:1.6;
}

.message{
display:flex;
gap:12px;
margin:25px 0;
}

.message.user{
justify-content:flex-end;
}

.avatar{
width:32px;
height:32px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;
font-size:15px;
}

.ai-avatar{
background:#e8f2ea;
}

.user-avatar{
background:#176b35;
color:#fff;
}

.message-content{
max-width:78%;
font-size:15px;
line-height:1.7;
word-wrap:break-word;
overflow-wrap:anywhere;
}

.message.user .message-content{
background:#176b35;
color:#fff;
padding:11px 15px;
border-radius:17px;
border-bottom-right-radius:5px;
}

.message.ai .message-content{
color:#1f2937;
padding-top:2px;
}

/* ================= ACTIONS ================= */

.message-actions{
display:flex;
gap:5px;
margin-top:7px;
}

.action-btn{
border:0;
background:transparent;
color:#6b7280;
cursor:pointer;
font-size:12px;
padding:5px 7px;
border-radius:6px;
}

.action-btn:hover{
background:#f1f3f1;
color:#176b35;
}

/* ================= TYPING ================= */

.typing{
display:flex;
gap:5px;
align-items:center;
padding:8px 0;
}

.dot{
width:7px;
height:7px;
background:#176b35;
border-radius:50%;
animation:blink 1.2s infinite;
}

.dot:nth-child(2){
animation-delay:.2s;
}

.dot:nth-child(3){
animation-delay:.4s;
}

@keyframes blink{

0%,80%,100%{
opacity:.25;
}

40%{
opacity:1;
}

}

/* ================= INPUT ================= */

.input-area{
position:fixed;
bottom:0;
left:270px;
right:0;
background:linear-gradient(
to top,
#fff 75%,
rgba(255,255,255,0)
);
padding:20px 15px 18px;
z-index:20;
}

.input-inner{
max-width:820px;
margin:auto;
}

.input-box{
display:flex;
align-items:flex-end;
gap:8px;
border:1px solid #cfd5cf;
border-radius:17px;
padding:8px 9px 8px 15px;
background:#fff;
box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.input-box:focus-within{
border-color:#176b35;
box-shadow:0 2px 15px rgba(23,107,53,.12);
}

#userMessage{
flex:1;
border:0;
outline:0;
resize:none;
font-family:Arial,Helvetica,sans-serif;
font-size:15px;
line-height:1.5;
max-height:150px;
min-height:26px;
background:transparent;
color:#1f2937;
}

#userMessage::placeholder{
color:#8a918b;
}

.send-btn{
width:40px;
height:40px;
border:0;
border-radius:11px;
background:#176b35;
color:#fff;
cursor:pointer;
font-size:18px;
flex-shrink:0;
}

.send-btn:hover{
background:#12552a;
}

.send-btn:disabled{
opacity:.5;
cursor:not-allowed;
}

.input-note{
text-align:center;
font-size:10px;
color:#8a918b;
margin-top:7px;
}

/* ================= COMMUNITY ================= */

.community-box{
margin-top:15px;
padding:18px;
border:1px solid #d9e5dc;
border-radius:14px;
background:#f8fbf9;
max-width:420px;
}

.community-box input{
width:100%;
padding:12px;
border:1px solid #cfd5cf;
border-radius:9px;
outline:none;
font-size:14px;
margin-bottom:10px;
}

.community-box input:focus{
border-color:#176b35;
}

.community-box button{
width:100%;
border:0;
padding:11px;
border-radius:9px;
background:#176b35;
color:#fff;
font-size:14px;
font-weight:bold;
cursor:pointer;
}

.community-box button:disabled{
opacity:.5;
cursor:not-allowed;
}

.community-message{
margin-top:10px;
font-size:13px;
line-height:1.5;
}

.community-success{
color:#176b35;
font-weight:bold;
}

.community-error{
color:#b42318;
}

/* ================= MOBILE ================= */

.overlay{
display:none;
}

@media(max-width:750px){

.sidebar{
position:fixed;
left:-280px;
top:0;
z-index:100;
transition:left .25s ease;
box-shadow:5px 0 20px rgba(0,0,0,.15);
}

.sidebar.open{
left:0;
}

.overlay.show{
display:block;
position:fixed;
inset:0;
background:rgba(0,0,0,.35);
z-index:90;
}

.menu-btn{
display:block;
}

.input-area{
left:0;
}

.topbar{
height:58px;
padding:0 10px;
gap:8px;
}

.back-btn{
padding:7px 10px;
font-size:13px;
}

.top-title{
font-size:15px;
}

.status{
display:none;
}

.chat-container{
padding:20px 10px 140px;
}

.welcome{
padding:55px 10px 25px;
}

.welcome h1{
font-size:22px;
}

.message-content{
max-width:88%;
font-size:14px;
}

.avatar{
width:29px;
height:29px;
font-size:13px;
}

.input-area{
padding:14px 10px 13px;
}

}

/* ================= SCROLLBAR ================= */

::-webkit-scrollbar{
width:7px;
}

::-webkit-scrollbar-thumb{
background:#cfd5cf;
border-radius:10px;
}

</style>

</head>

<script>

/* =========================================================
   SR CRESCO KNOWLEDGE AI
========================================================= */

const API_URL =
"https://sr-cresco.vercel.app/api/chat";

const COMMUNITY_API_URL =
"https://sr-cresco.vercel.app/api/community";

/* ================= ELEMENTS ================= */

const input =
document.getElementById("userMessage");

const sendBtn =
document.getElementById("sendBtn");

const chatMessages =
document.getElementById("chatMessages");

const chatContainer =
document.getElementById("chatContainer");

const sidebar =
document.getElementById("sidebar");

const menuBtn =
document.getElementById("menuBtn");

const overlay =
document.getElementById("overlay");

const newChatBtn =
document.getElementById("newChat");

const clearAllBtn =
document.getElementById("clearAll");

const historyDiv =
document.getElementById("history");

/* ================= STATE ================= */

let conversation = [];

let chats =
JSON.parse(
localStorage.getItem("srcresco_chats") || "[]"
);

let currentChatId = null;

/* ================= SEND BUTTON ================= */

sendBtn.addEventListener(
"click",
function(){
sendMessage();
}
);

/* ================= MOBILE SIDEBAR ================= */

menuBtn.addEventListener(
"click",
function(){

sidebar.classList.add("open");

overlay.classList.add("show");

}
);

overlay.addEventListener(
"click",
function(){

sidebar.classList.remove("open");

overlay.classList.remove("show");

}
);

/* ================= NEW CHAT ================= */

newChatBtn.addEventListener(
"click",
function(){

startNewChat();

sidebar.classList.remove("open");

overlay.classList.remove("show");

}
);

function startNewChat(){

conversation = [];

currentChatId = Date.now();

chatMessages.innerHTML = `

<div class="welcome" id="welcome">

<img
src="logo.png"
class="welcome-logo"
alt="SR CRESCO"
>

<h1>
How can I help you?
</h1>

<p>
I'm <b>SR CRESCO KNOWLEDGE AI</b>.<br>
Ask questions, learn, create, research or get help with agriculture and technology.
</p>

</div>

`;

input.value = "";

autoResize();

input.focus();

}

/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

const message =
input.value.trim();

if(
!message ||
sendBtn.disabled
){

return;

}

const welcome =
document.getElementById("welcome");

if(welcome){
welcome.remove();
}

addMessage(
"user",
message
);

conversation.push({

role:"user",

content:message

});

input.value = "";

autoResize();

sendBtn.disabled = true;

/* ================= TYPING ================= */

const typing =
document.createElement("div");

typing.className =
"message ai";

typing.id =
"typing";

typing.innerHTML = `

<div class="avatar ai-avatar">
🌱
</div>

<div class="message-content">

<div class="typing">

<span class="dot"></span>

<span class="dot"></span>

<span class="dot"></span>

</div>

</div>

`;

chatMessages.appendChild(typing);

scrollBottom();

/* =========================================================
   API REQUEST
========================================================= */

try{

const response =
await fetch(
API_URL,
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

messages:conversation

})

}
);

let data = {};

try{

data =
await response.json();

}catch(jsonError){

data = {};

}

if(typing){

typing.remove();

}

if(!response.ok){

const errorMessage =
data.error ||
`AI request failed (${response.status}).`;

addMessage(
"ai",
"❌ " + errorMessage
);

}else{

const reply =
data.reply ||
"No response received from SR CRESCO KNOWLEDGE AI.";

conversation.push({

role:"assistant",

content:reply

});

addMessage(
"ai",
reply
);

saveCurrentChat();

}

}catch(error){

if(typing){

typing.remove();

}

console.error(
"SR CRESCO AI connection error:",
error
);

addMessage(
"ai",
"❌ Unable to connect to SR CRESCO KNOWLEDGE AI. Please try again."
);

}

sendBtn.disabled = false;

input.focus();

scrollBottom();

renderHistory();

}

/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
type,
text
){

const messageDiv =
document.createElement("div");

messageDiv.className =
"message " + type;

const avatar =
document.createElement("div");

avatar.className =
"avatar " +
(
type === "ai"
?
"ai-avatar"
:
"user-avatar"
);

avatar.textContent =
type === "ai"
?
"🌱"
:
"U";

const content =
document.createElement("div");

content.className =
"message-content";

content.innerHTML =
escapeHTML(text)
.replace(/\n/g,"<br>");

/* ================= AI ACTIONS ================= */

if(type === "ai"){

const actions =
document.createElement("div");

actions.className =
"message-actions";

actions.innerHTML = `

<button class="action-btn copy-btn">
📋 Copy
</button>

<button class="action-btn regenerate-btn">
↻ Regenerate
</button>

`;

actions
.querySelector(".copy-btn")
.addEventListener(
"click",
async function(){

try{

await navigator.clipboard.writeText(text);

this.textContent =
"✓ Copied";

setTimeout(
()=>{
this.textContent =
"📋 Copy";
},
1500
);

}catch(error){

this.textContent =
"Copy failed";

}

}
);

actions
.querySelector(".regenerate-btn")
.addEventListener(
"click",
function(){

regenerateLast();

}
);

content.appendChild(actions);

}

if(type === "user"){

messageDiv.appendChild(content);

messageDiv.appendChild(avatar);

}else{

messageDiv.appendChild(avatar);

messageDiv.appendChild(content);

}

chatMessages.appendChild(messageDiv);

scrollBottom();

}

/* =========================================================
   REGENERATE
========================================================= */

async function regenerateLast(){

if(sendBtn.disabled){

return;

}

if(conversation.length < 1){

return;

}

if(
conversation[
conversation.length - 1
].role === "assistant"
){

conversation.pop();

}

const messages =
chatMessages.querySelectorAll(
".message.ai"
);

if(messages.length){

messages[
messages.length - 1
].remove();

}

sendBtn.disabled = true;

const typing =
document.createElement("div");

typing.className =
"message ai";

typing.id =
"typing";

typing.innerHTML = `

<div class="avatar ai-avatar">
🌱
</div>

<div class="message-content">

<div class="typing">

<span class="dot"></span>

<span class="dot"></span>

<span class="dot"></span>

</div>

</div>

`;

chatMessages.appendChild(typing);

scrollBottom();

try{

const response =
await fetch(
API_URL,
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

messages:conversation

})

}
);

let data = {};

try{

data =
await response.json();

}catch(error){

data = {};

}

if(typing){

typing.remove();

}

if(response.ok){

const reply =
data.reply ||
"No response received.";

conversation.push({

role:"assistant",

content:reply

});

addMessage(
"ai",
reply
);

saveCurrentChat();

}else{

addMessage(
"ai",
"❌ " +
(
data.error ||
`Regeneration failed (${response.status}).`
)
);

}

}catch(error){

if(typing){

typing.remove();

}

console.error(
"Regenerate error:",
error
);

addMessage(
"ai",
"❌ Unable to regenerate response."
);

}

sendBtn.disabled = false;

input.focus();

scrollBottom();

renderHistory();

}

/* =========================================================
   SAVE CHAT
========================================================= */

function saveCurrentChat(){

if(!conversation.length){

return;

}

if(!currentChatId){

currentChatId =
Date.now();

}

const firstUser =
conversation.find(
x => x.role === "user"
);

const title =
firstUser
?
firstUser.content.substring(0,35)
:
"New chat";

const existing =
chats.find(
x => x.id === currentChatId
);

if(existing){

existing.messages =
conversation;

existing.title =
title;

}else{

chats.unshift({

id:currentChatId,

title:title,

messages:conversation

});

}

chats =
chats.slice(0,30);

localStorage.setItem(
"srcresco_chats",
JSON.stringify(chats)
);

}

/* =========================================================
   HISTORY
========================================================= */

function renderHistory(){

historyDiv.innerHTML = "";

chats.forEach(
chat => {

const item =
document.createElement("div");

item.className =
"history-item";

item.textContent =
chat.title;

item.title =
chat.title;

item.addEventListener(
"click",
function(){

loadChat(chat.id);

sidebar.classList.remove("open");

overlay.classList.remove("show");

}
);

historyDiv.appendChild(item);

}
);

}

/* =========================================================
   LOAD CHAT
========================================================= */

function loadChat(id){

const chat =
chats.find(
x => x.id === id
);

if(!chat){

return;

}

currentChatId =
chat.id;

conversation =
[...chat.messages];

chatMessages.innerHTML = "";

conversation.forEach(
message => {

addMessage(

message.role === "assistant"
?
"ai"
:
"user",

message.content

);

}
);

scrollBottom();

}

/* =========================================================
   CLEAR ALL
========================================================= */

clearAllBtn.addEventListener(
"click",
function(){

if(
!confirm(
"Delete all saved chats?"
)
){

return;

}

chats = [];

conversation = [];

currentChatId = null;

localStorage.removeItem(
"srcresco_chats"
);

startNewChat();

renderHistory();

}
);

/* =========================================================
   AUTO RESIZE
========================================================= */

input.addEventListener(
"input",
autoResize
);

function autoResize(){

input.style.height =
"auto";

input.style.height =
Math.min(
input.scrollHeight,
150
) + "px";

}

/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(text){

const div =
document.createElement("div");

div.textContent =
String(text);

return div.innerHTML;

}

/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

setTimeout(
function(){

chatContainer.scrollTop =
chatContainer.scrollHeight;

},
50
);

}

/* =========================================================
   COMMUNITY JOIN
========================================================= */

function startCommunityJoin(){

const params =
new URLSearchParams(
window.location.search
);

if(
params.get("community") !== "join"
){

return;

}

const welcome =
document.getElementById("welcome");

if(welcome){
welcome.remove();
}

addMessage(
"ai",
"🌱 Welcome to SR CRESCO Community.\n\nTo request community membership, please verify your email address first."
);

const box =
document.createElement("div");

box.className =
"community-box";

box.innerHTML = `

<div style="
font-weight:bold;
margin-bottom:10px;
">
📧 Email Verification
</div>

<input
type="email"
id="communityEmail"
placeholder="Enter your email address"
autocomplete="email"
>

<button
id="sendOtpBtn"
>
Send OTP
</button>

<div
id="communityStatus"
class="community-message"
></div>

`;

chatMessages.appendChild(box);

scrollBottom();

const emailInput =
document.getElementById(
"communityEmail"
);

const sendOtpBtn =
document.getElementById(
"sendOtpBtn"
);

const status =
document.getElementById(
"communityStatus"
);

sendOtpBtn.addEventListener(
"click",
async function(){

const email =
emailInput.value.trim();

if(!email){

status.className =
"community-message community-error";

status.textContent =
"Please enter your email address.";

return;

}

sendOtpBtn.disabled = true;

status.className =
"community-message";

status.textContent =
"Sending OTP...";

try{

const response =
await fetch(
COMMUNITY_API_URL,
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action:"send_otp",

email:email

})

}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error ||
"Unable to send OTP."
);

}

status.className =
"community-message community-success";

status.textContent =
"✅ OTP sent to your email.";

showOtpForm(
data.requestId,
email,
box
);

}catch(error){

status.className =
"community-message community-error";

status.textContent =
"❌ " + error.message;

sendOtpBtn.disabled = false;

}

}
);

}

/* =========================================================
   OTP FORM
========================================================= */

function showOtpForm(
requestId,
email,
box
){

box.innerHTML = `

<div style="
font-weight:bold;
margin-bottom:10px;
">
🔐 Email Verification
</div>

<div style="
font-size:13px;
margin-bottom:12px;
color:#6b7280;
">
OTP sent to ${escapeHTML(email)}
</div>

<input
type="text"
id="communityOtp"
placeholder="Enter 6-digit OTP"
inputmode="numeric"
maxlength="6"
autocomplete="one-time-code"
>

<button
id="verifyOtpBtn"
>
Verify OTP
</button>

<div
id="otpStatus"
class="community-message"
></div>

`;

const otpInput =
document.getElementById(
"communityOtp"
);

const verifyBtn =
document.getElementById(
"verifyOtpBtn"
);

const status =
document.getElementById(
"otpStatus"
);

verifyBtn.addEventListener(
"click",
async function(){

const otp =
otpInput.value.trim();

if(!/^\d{6}$/.test(otp)){

status.className =
"community-message community-error";

status.textContent =
"Please enter the 6-digit OTP.";

return;

}

verifyBtn.disabled = true;

status.className =
"community-message";

status.textContent =
"Verifying OTP...";

try{

const response =
await fetch(
COMMUNITY_API_URL,
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action:"verify_otp",

requestId:requestId,

otp:otp

})

}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error ||
"OTP verification failed."
);

}

status.className =
"community-message community-success";

status.textContent =
"✅ Email verified successfully.";

setTimeout(
function(){

box.innerHTML = `

<div style="
font-weight:bold;
font-size:16px;
margin-bottom:10px;
">
🌱 Request Submitted
</div>

<div style="
font-size:14px;
line-height:1.6;
">
Your email has been verified successfully.

<br><br>

Your SR CRESCO Community request has been
sent for admin approval.

<br><br>

📩 You will receive an email after approval.

<br><br>

Please wait for the approval email.
</div>

`;

},
500
);

}catch(error){

status.className =
"community-message community-error";

status.textContent =
"❌ " + error.message;

verifyBtn.disabled = false;

}

}
);

}

/* =========================================================
   APPROVED COMMUNITY ACCESS
========================================================= */

async function checkCommunityAccess(){

const params =
new URLSearchParams(
window.location.search
);

if(
params.get("community") !== "access"
){

return;

}

const token =
params.get("token");

if(!token){

return;

}

const welcome =
document.getElementById("welcome");

if(welcome){
welcome.remove();
}

addMessage(
"ai",
"🔐 Checking your SR CRESCO Community approval..."
);

try{

const response =
await fetch(
COMMUNITY_API_URL,
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action:"check_access",

token:token

})

}
);

const data =
await response.json();

if(!response.ok){

addMessage(
"ai",
"❌ " +
(
data.error ||
"Community access is not approved."
)
);

return;

}

addMessage(
"ai",
"✅ Your SR CRESCO Community access has been approved."
);

const accessBox =
document.createElement("div");

accessBox.className =
"community-box";

accessBox.innerHTML = `

<div style="
font-weight:bold;
margin-bottom:12px;
">
🌱 SR CRESCO Community
</div>

<div style="
font-size:14px;
line-height:1.6;
margin-bottom:14px;
">
Your membership request has been approved.
</div>

<button id="joinCommunityFinal">
Join SR CRESCO Community →
</button>

`;

chatMessages.appendChild(
accessBox
);

scrollBottom();

document
.getElementById(
"joinCommunityFinal"
)
.addEventListener(
"click",
function(){

window.location.href =
data.communityLink;

}
);

}catch(error){

console.error(
"Community access error:",
error
);

addMessage(
"ai",
"❌ Unable to verify community access. Please try again."
);

}

}

/* =========================================================
   START
========================================================= */

renderHistory();

input.focus();

/* Community URL handling */

startCommunityJoin();

checkCommunityAccess();

</script>

</body>
</html>
