<script>

/* =====================================================
   SR CRESCO KNOWLEDGE AI
===================================================== */


/* ================= VERCEL API ================= */


/*
 GitHub Pages:
 https://srcresco.github.io/SR-CRESCO/

 Vercel backend:
 https://sr-cresco-ai.vercel.app/api/chat
*/

const API_URL =
"https://sr-cresco-ai.vercel.app/api/chat";


/* ================= ELEMENTS ================= */

const input =
document.getElementById("userMessage");

const sendBtn =
document.getElementById("sendBtn");

const chatMessages =
document.getElementById("chatMessages");

const chatContainer =
document.getElementById("chatContainer");

const sidebar =
document.getElementById("sidebar");

const menuBtn =
document.getElementById("menuBtn");

const overlay =
document.getElementById("overlay");

const newChatBtn =
document.getElementById("newChat");

const clearAllBtn =
document.getElementById("clearAll");

const historyDiv =
document.getElementById("history");


/* ================= STATE ================= */

let conversation = [];

let chats = [];

let currentChatId = null;


/* ================= LOAD CHATS ================= */

try{

chats =
JSON.parse(
localStorage.getItem(
"srcresco_chats"
) || "[]"
);

if(!Array.isArray(chats)){

chats = [];

}

}catch(error){

chats = [];

}


/* ================= SEND ================= */

sendBtn.addEventListener(
"click",
function(){

sendMessage();

});


/* ================= MOBILE MENU ================= */

menuBtn.addEventListener(
"click",
function(){

sidebar.classList.add("open");

overlay.classList.add("show");

});


overlay.addEventListener(
"click",
function(){

sidebar.classList.remove("open");

overlay.classList.remove("show");

});


/* ================= NEW CHAT ================= */

newChatBtn.addEventListener(
"click",
function(){

startNewChat();

sidebar.classList.remove("open");

overlay.classList.remove("show");

});


function startNewChat(){

conversation = [];

currentChatId = null;


chatMessages.innerHTML = `

<div
class="welcome"
id="welcome">

<img
src="logo.png"
class="welcome-logo"
alt="SR CRESCO">

<h1>
How can I help you?
</h1>

<p>
I'm <b>SR CRESCO KNOWLEDGE AI</b>.<br>
Ask questions, learn, create,
research or get help with
agriculture and technology.
</p>

</div>

`;


input.value = "";

autoResize();

input.focus();

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

const message =
input.value.trim();


if(
!message ||
sendBtn.disabled
){

return;

}


/* REMOVE WELCOME */

const welcome =
document.getElementById(
"welcome"
);

if(welcome){

welcome.remove();

}


/* USER MESSAGE */

addMessage(
"user",
message
);


conversation.push({

role:"user",

content:message

});


input.value = "";

autoResize();

sendBtn.disabled = true;


/* TYPING */

const typing =
createTyping();

chatMessages.appendChild(
typing
);

scrollBottom();


/* ================= API ================= */

try{

const response =
await fetch(
API_URL,
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

messages:
conversation

})

}
);


/* SAFE RESPONSE */

const rawText =
await response.text();


let data = {};


try{

data =
JSON.parse(rawText);

}catch(parseError){

data = {

error:
rawText ||
"Invalid response from server."

};

}


if(typing){

typing.remove();

}


/* ERROR */

if(!response.ok){

addMessage(
"ai",
"❌ " +
(
data.error ||
data.message ||
`Server error (${response.status})`
)
);

}


/* SUCCESS */

else{

const reply =
data.reply ||
data.message ||
"No response received from SR CRESCO KNOWLEDGE AI.";


conversation.push({

role:"assistant",

content:reply

});


addMessage(
"ai",
reply
);


saveCurrentChat();

}


}catch(error){

console.error(
"SR CRESCO AI Error:",
error
);


if(typing){

typing.remove();

}


addMessage(
"ai",
"❌ Unable to connect to SR CRESCO KNOWLEDGE AI. Please try again."
);

}


sendBtn.disabled = false;

input.focus();

scrollBottom();

renderHistory();

}


/* =====================================================
   TYPING
===================================================== */

function createTyping(){

const typing =
document.createElement("div");

typing.className =
"message ai";

typing.id =
"typing";


typing.innerHTML = `

<div class="avatar ai-avatar">
🌱
</div>

<div class="message-content">

<div class="typing">

<span class="dot"></span>

<span class="dot"></span>

<span class="dot"></span>

</div>

</div>

`;


return typing;

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
type,
text
){

const messageDiv =
document.createElement("div");

messageDiv.className =
"message " + type;


const avatar =
document.createElement("div");

avatar.className =
"avatar " +
(
type === "ai"
?
"ai-avatar"
:
"user-avatar"
);


avatar.textContent =
type === "ai"
?
"🌱"
:
"U";


const content =
document.createElement("div");

content.className =
"message-content";


content.innerHTML =
escapeHTML(
String(text)
).replace(
/\n/g,
"<br>"
);


/* ================= AI ACTIONS ================= */

if(type === "ai"){

const actions =
document.createElement("div");

actions.className =
"message-actions";


const copyBtn =
document.createElement("button");

copyBtn.className =
"action-btn";

copyBtn.textContent =
"📋 Copy";


const regenerateBtn =
document.createElement("button");

regenerateBtn.className =
"action-btn";

regenerateBtn.textContent =
"↻ Regenerate";


/* COPY */

copyBtn.addEventListener(
"click",
async function(){

try{

await navigator.clipboard.writeText(
String(text)
);

copyBtn.textContent =
"✓ Copied";

}catch(error){

copyBtn.textContent =
"Copy failed";

}


setTimeout(
function(){

copyBtn.textContent =
"📋 Copy";

},
1500
);

});


/* REGENERATE */

regenerateBtn.addEventListener(
"click",
function(){

regenerateLast();

});


actions.appendChild(
copyBtn
);

actions.appendChild(
regenerateBtn
);

content.appendChild(
actions
);

}


/* ================= POSITION ================= */

if(type === "user"){

messageDiv.appendChild(
content
);

messageDiv.appendChild(
avatar
);

}else{

messageDiv.appendChild(
avatar
);

messageDiv.appendChild(
content
);

}


chatMessages.appendChild(
messageDiv
);

scrollBottom();

}


/* =====================================================
   REGENERATE
===================================================== */

async function regenerateLast(){

if(sendBtn.disabled){

return;

}


if(conversation.length < 2){

return;

}


/* Last item must be AI */

if(
conversation[
conversation.length - 1
].role !== "assistant"
){

return;

}


/* Remove previous AI */

conversation.pop();


const aiMessages =
chatMessages.querySelectorAll(
".message.ai"
);


if(aiMessages.length){

aiMessages[
aiMessages.length - 1
].remove();

}


sendBtn.disabled = true;


/* TYPING */

const typing =
createTyping();

chatMessages.appendChild(
typing
);

scrollBottom();


try{

const response =
await fetch(
API_URL,
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

messages:
conversation

})

}
);


const rawText =
await response.text();


let data = {};


try{

data =
JSON.parse(rawText);

}catch(error){

data = {

error:
rawText ||
"Invalid response from server."

};

}


if(typing){

typing.remove();

}


if(!response.ok){

addMessage(
"ai",
"❌ " +
(
data.error ||
data.message ||
`Server error (${response.status})`
)
);

}else{

const reply =
data.reply ||
data.message ||
"No response received.";


conversation.push({

role:"assistant",

content:reply

});


addMessage(
"ai",
reply
);


saveCurrentChat();

}


}catch(error){

console.error(
"Regenerate Error:",
error
);


if(typing){

typing.remove();

}


addMessage(
"ai",
"❌ Unable to regenerate response. Please try again."
);

}


sendBtn.disabled = false;

input.focus();

scrollBottom();

renderHistory();

}


/* =====================================================
   SAVE CHAT
===================================================== */

function saveCurrentChat(){

if(!conversation.length){

return;

}


if(!currentChatId){

currentChatId =
Date.now();

}


const firstUser =
conversation.find(
x => x.role === "user"
);


const title =
firstUser
?
firstUser.content
.substring(0,35)
:
"New chat";


const existing =
chats.find(
x =>
x.id === currentChatId
);


if(existing){

existing.messages =
[...conversation];

existing.title =
title;

}else{

chats.unshift({

id:
currentChatId,

title:
title,

messages:
[...conversation]

});

}


/* KEEP LAST 30 */

chats =
chats.slice(0,30);


try{

localStorage.setItem(
"srcresco_chats",
JSON.stringify(chats)
);

}catch(error){

console.error(
"Chat save error:",
error
);

}

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

historyDiv.innerHTML = "";


chats.forEach(
function(chat){

const item =
document.createElement("div");


item.className =
"history-item";


item.textContent =
chat.title ||
"New chat";


item.title =
chat.title ||
"New chat";


item.addEventListener(
"click",
function(){

loadChat(
chat.id
);


sidebar.classList.remove(
"open"
);

overlay.classList.remove(
"show"
);

});


historyDiv.appendChild(
item
);

});

}


/* =====================================================
   LOAD CHAT
===================================================== */

function loadChat(id){

const chat =
chats.find(
x => x.id === id
);


if(!chat){

return;

}


currentChatId =
chat.id;


conversation =
[...chat.messages];


chatMessages.innerHTML =
"";


conversation.forEach(
function(message){

addMessage(

message.role ===
"assistant"
?
"ai"
:
"user",

message.content

);

});


scrollBottom();

}


/* =====================================================
   CLEAR ALL
===================================================== */

clearAllBtn.addEventListener(
"click",
function(){

if(
!confirm(
"Delete all saved chats?"
)
){

return;

}


chats = [];

conversation = [];

currentChatId = null;


localStorage.removeItem(
"srcresco_chats"
);


startNewChat();

renderHistory();

});


/* =====================================================
   ENTER TO SEND
===================================================== */

input.addEventListener(
"keydown",
function(event){

if(
event.key === "Enter" &&
!event.shiftKey
){

event.preventDefault();

sendMessage();

}

});


/* =====================================================
   AUTO RESIZE
===================================================== */

input.addEventListener(
"input",
autoResize
);


function autoResize(){

input.style.height =
"auto";


input.style.height =
Math.min(
input.scrollHeight,
150
) + "px";

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(text){

const div =
document.createElement("div");
